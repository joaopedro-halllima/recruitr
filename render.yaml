databases:
  - name: recruitr-db
    plan: starter
    databaseName: recruitr
    user: recruitr

services:
  # ── FastAPI backend ──
  - type: web
    name: recruitr-api
    runtime: python
    plan: starter
    rootDir: api
    buildCommand: pip install -r requirements.txt && chmod +x render-start.sh
    startCommand: ./render-start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: recruitr-db
          property: connectionURI
      - key: ENV
        value: dev
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://recruitr-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://recruitr-web.onrender.com
      - key: LOCAL_UPLOAD_DIR
        value: /var/data/recruitr_uploads
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
    disk:
      name: recruitr-uploads
      mountPath: /var/data/recruitr_uploads
      sizeGB: 1

  # ── Next.js frontend ──
  - type: web
    name: recruitr-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://recruitr-api.onrender.com
      - key: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
        value: "true"
